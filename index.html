<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F4EFE5" />
  <meta name="description" content="A personal notes space with cloud sync and read-only offline access." />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon-192.png" type="image/png" />
  <title>Memory — Personal Notes</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.min.js"></script>
  <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
  <script src="./vendor/purify.min.js"></script>
  <script src="./note-sanitizer.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-main: #F4EFE5;
      --bg-surface: #E5DDCB;
      --bg-elevated: #FAF7F1;
      --text-main: #493F32;
      --text-muted: #7A6E5D;
      --accent-olive: #778267;
      --accent-olive-hover: #677258;
      --accent-clay: #B77C60;
      --accent-sand: #D8BFA5;
      --border-muted: rgba(73, 63, 50, 0.14);
      --border-strong: rgba(73, 63, 50, 0.24);
      --shadow-card: 0 1px 3px rgba(73, 63, 50, 0.06), 0 1px 2px rgba(73, 63, 50, 0.04);
      --shadow-modal: 0 18px 40px rgba(41, 43, 37, 0.16);

      /* Approved 5 muted note colours (Light) */
      --note-paper: #FAF7F0;
      --note-oatmeal: #E5DDCB;
      --note-sand: #E6D5C3;
      --note-olive: #DCE1D4;
      --note-clay: #E8D2C6;
    }

    html.dark {
      --bg-main: #292B25;
      --bg-surface: #32352D;
      --bg-elevated: #363930;
      --text-main: #ECE7DC;
      --text-muted: #A9A294;
      --accent-olive: #8A9679;
      --accent-olive-hover: #9AA689;
      --accent-clay: #C88C70;
      --accent-sand: #8C7761;
      --border-muted: rgba(236, 231, 220, 0.11);
      --border-strong: rgba(236, 231, 220, 0.22);
      --shadow-card: 0 1px 3px rgba(0, 0, 0, 0.22);
      --shadow-modal: 0 20px 48px rgba(0, 0, 0, 0.45);

      /* Approved 5 muted note colours (Dark) */
      --note-paper: #34372F;
      --note-oatmeal: #3E3D34;
      --note-sand: #463D33;
      --note-olive: #353E30;
      --note-clay: #47362F;
    }

    * {
      box-sizing: border-box;
    }
    :focus-visible { outline: 3px solid var(--accent-olive); outline-offset: 3px; }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media (forced-colors: active) { :focus-visible { outline: 2px solid Highlight; } .note-card.is-selected { outline: 2px solid Highlight; } }

    body.auth-locked #app { display: none !important; }
    body.auth-locked #auth-gate { display: flex !important; }

    body {
      margin: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      transition: background-color 150ms ease, color 150ms ease;
    }

    .bg-main { background-color: var(--bg-main); }
    .bg-surface { background-color: var(--bg-surface); }
    .bg-elevated { background-color: var(--bg-elevated); }
    .text-main { color: var(--text-main); }
    .text-muted { color: var(--text-muted); }
    .border-muted { border-color: var(--border-muted); }
    .border-strong { border-color: var(--border-strong); }

    .note-bg-paper { background-color: var(--note-paper); }
    .note-bg-oatmeal { background-color: var(--note-oatmeal); }
    .note-bg-sand { background-color: var(--note-sand); }
    .note-bg-olive { background-color: var(--note-olive); }
    .note-bg-clay { background-color: var(--note-clay); }

    .label-card { border-radius: 16px; border: 1px solid var(--border-muted); box-shadow: var(--shadow-card); }
    .label-swatch { width: 17px; height: 17px; border-radius: 999px; border: 2px solid rgba(255,255,255,.75); box-shadow: 0 0 0 1px var(--border-muted); }
    .label-card-actions button { min-width: 27px; min-height: 27px; }
    .note-card {
      height: 112px;
      border-radius: 14px;
      border: 1px solid var(--border-muted);
      box-shadow: var(--shadow-card);
      transition: border-color 140ms ease, box-shadow 140ms ease, opacity 140ms ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .note-card:hover {
      border-color: var(--border-strong);
    }

    .note-card.is-selected {
      border-color: var(--accent-olive);
      box-shadow: 0 0 0 2px var(--accent-olive);
    }

    .note-card.is-dragging {
      opacity: 0.45;
    }

    .note-card.drag-over {
      border-color: var(--accent-olive);
      box-shadow: 0 0 0 2px var(--accent-olive);
    }

    .drag-handle {
      cursor: grab;
      touch-action: none;
    }
    .drag-handle:active {
      cursor: grabbing;
    }

    .line-clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .btn-olive {
      background-color: var(--accent-olive);
      color: #FAF7F0;
    }
    .btn-olive:hover {
      background-color: var(--accent-olive-hover);
    }

    .nav-item.active {
      background-color: var(--bg-surface);
      font-weight: 500;
    }

    .editor-content {
      outline: none;
      min-height: 200px;
      line-height: 1.65;
    }
    .editor-content:empty::before {
      content: attr(data-placeholder);
      color: var(--text-muted);
      pointer-events: none;
    }
    .editor-content ul {
      list-style-type: disc;
      padding-left: 1.35rem;
      margin: 0.4rem 0;
    }
    .editor-content ol {
      list-style-type: decimal;
      padding-left: 1.35rem;
      margin: 0.4rem 0;
    }

    .checklist-row input[type="checkbox"] {
      accent-color: var(--accent-olive);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .checklist-done {
      text-decoration: line-through;
      opacity: 0.6;
    }
    body.cloud-readonly #quick-capture-btn, body.cloud-readonly #new-folder-form, body.cloud-readonly #new-label-form, body.cloud-readonly #bulk-toolbar, body.cloud-readonly #editor-more-btn, body.cloud-readonly #formatting-bar, body.cloud-readonly #add-link-bar, body.cloud-readonly #reset-memory-btn, body.cloud-readonly #import-json-input, body.cloud-readonly [data-folder-menu], body.cloud-readonly [data-delete-label], body.cloud-readonly [data-edit-link], body.cloud-readonly [data-remove-link], body.cloud-readonly [data-remove-att], body.cloud-readonly .remove-check-btn { display: none !important; }
    body.cloud-readonly .drag-handle { display: none !important; }

    /* Subtle custom scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--border-strong);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="min-h-screen bg-main text-main auth-locked">
  <section id="auth-gate" class="fixed inset-0 z-[100] hidden items-center justify-center bg-main px-5 py-8" aria-labelledby="auth-gate-title">
    <div class="w-full max-w-sm rounded-2xl border border-muted bg-elevated p-6 text-center" style="box-shadow: var(--shadow-modal);">
      <div class="mx-auto mb-4 flex h-11 w-11 items-center justify-center rounded-xl" style="background-color: var(--accent-olive); color: #FAF7F0;"><i data-lucide="book-marked" class="h-5 w-5"></i></div>
      <h1 id="auth-gate-title" class="text-xl font-semibold">Welcome to Memory</h1>
      <p id="auth-gate-message" class="mt-2 text-sm text-muted" role="status" aria-live="polite">Checking your account…</p>
      <button id="auth-gate-google-btn" type="button" class="mt-5 w-full rounded-xl btn-olive px-4 py-3 text-sm font-medium">Continue with Google</button>
      <p class="mt-3 text-[11px] text-muted">Sign in is required to access your notes.</p>
    </div>
  </section>

  <div id="app" class="min-h-screen flex">
    <!-- Desktop Persistent Sidebar (No redundant hamburger on desktop) -->
    <aside class="hidden md:flex md:flex-col w-60 shrink-0 border-r border-muted bg-main sticky top-0 h-screen px-3 py-4">
      <div class="flex items-center gap-2.5 px-3 pb-4 mb-2">
        <span class="w-7 h-7 rounded-lg flex items-center justify-center" style="background-color: var(--accent-olive); color: #FAF7F0;">
          <i data-lucide="book-marked" class="w-4 h-4"></i>
        </span>
        <span class="text-lg font-semibold tracking-tight">Memory</span>
      </div>
      <nav id="desktop-nav" aria-label="Main navigation" class="flex-1 overflow-y-auto space-y-0.5 text-sm"></nav>
    </aside>

    <!-- Mobile Slide-Out Navigation Drawer -->
    <div id="mobile-drawer-backdrop" class="fixed inset-0 z-40 bg-black/35 hidden md:hidden" aria-hidden="true"></div>
    <aside id="mobile-drawer" role="dialog" aria-modal="true" aria-label="Main navigation" aria-hidden="true" tabindex="-1" class="fixed inset-y-0 left-0 z-50 w-68 max-w-[82vw] bg-main border-r border-muted transform -translate-x-full transition-transform duration-200 flex flex-col px-3 py-4 md:hidden">
      <div class="flex items-center justify-between px-3 pb-4 mb-2">
        <div class="flex items-center gap-2.5">
          <span class="w-7 h-7 rounded-lg flex items-center justify-center" style="background-color: var(--accent-olive); color: #FAF7F0;">
            <i data-lucide="book-marked" class="w-4 h-4"></i>
          </span>
          <span class="text-lg font-semibold tracking-tight">Memory</span>
        </div>
        <button id="close-drawer-btn" type="button" class="p-2 rounded-lg hover:bg-surface text-muted" aria-label="Close navigation">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <nav id="mobile-nav" aria-label="Main navigation" class="flex-1 overflow-y-auto space-y-0.5 text-sm"></nav>
    </aside>

    <!-- Main Content Column -->
    <div class="flex-1 flex flex-col min-w-0">
      <!-- Compact Top Header -->
      <header class="sticky top-0 z-30 bg-main/95 backdrop-blur border-b border-muted px-4 md:px-6 h-14 flex items-center gap-3">
        <!-- Mobile-only hamburger + brand -->
        <button id="open-drawer-btn" type="button" class="md:hidden p-2 -ml-2 rounded-lg hover:bg-surface text-main" aria-label="Open menu">
          <i data-lucide="menu" class="w-5 h-5"></i>
        </button>
        <span class="md:hidden font-semibold text-base tracking-tight mr-1">Memory</span>

        <!-- Prominent Search Input -->
        <div class="flex-1 max-w-xl relative">
          <i data-lucide="search" class="w-4 h-4 text-muted absolute left-3 top-1/2 -translate-y-1/2 pointer-events-none"></i>
          <input
            id="search-input"
            type="search"
            aria-label="Search your notes"
            placeholder="Search your notes"
            class="w-full h-9 pl-9 pr-8 rounded-xl bg-elevated border border-muted text-sm text-main placeholder:text-muted focus:outline-none focus:border-strong"
          />
          <button id="clear-search-btn" type="button" class="hidden absolute right-2 top-1/2 -translate-y-1/2 p-1 rounded-md text-muted hover:text-main" aria-label="Clear search">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>

        <!-- Theme Switch -->
        <button id="theme-toggle-btn" type="button" class="p-2 rounded-xl border border-muted bg-elevated hover:bg-surface text-main shrink-0" aria-label="Toggle light or dark mode" title="Switch theme">
          <i id="theme-icon" data-lucide="moon" class="w-4 h-4"></i>
        </button>
      </header>

      <div id="cloud-status-banner" class="hidden px-4 md:px-6 py-2 text-xs text-muted border-b border-muted bg-surface" role="status" aria-live="polite"></div>

      <!-- Workspace Area -->
      <main id="main-content" tabindex="-1" class="flex-1 px-4 md:px-8 py-5 pb-28 max-w-6xl w-full mx-auto">
        <!-- Rendered dynamically -->
      </main>
    </div>
  </div>

  <!-- Multi-Select Bottom Bulk-Action Toolbar -->
  <div id="bulk-toolbar" class="hidden fixed bottom-4 left-1/2 -translate-x-1/2 z-40 w-[calc(100%-1.5rem)] max-w-xl">
    <!-- Bulk Colour Popover -->
    <div id="bulk-colour-popover" class="hidden mb-2 mx-auto w-fit px-3 py-2 rounded-2xl bg-elevated border border-muted shadow-lg flex items-center gap-2.5">
      <span class="text-xs text-muted mr-1">Note colour</span>
      <div id="bulk-colour-swatches" class="flex items-center gap-2"></div>
    </div>

    <div class="rounded-2xl bg-elevated border border-strong px-3.5 py-2.5 flex items-center justify-between gap-2" style="box-shadow: var(--shadow-modal);">
      <div class="flex items-center gap-2">
        <button id="bulk-exit-btn" type="button" class="p-1.5 rounded-lg hover:bg-surface text-muted" aria-label="Exit selection mode" title="Cancel selection">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
        <span id="bulk-count" class="text-sm font-medium whitespace-nowrap">0 selected</span>
      </div>

      <div id="bulk-actions-container" class="flex items-center gap-1 sm:gap-1.5 overflow-x-auto">
        <!-- Populated per view (Active vs Archive vs Trash) -->
      </div>
    </div>
  </div>

  <!-- Note Editor Modal (Full-screen on mobile, centred pop-up on tablet & desktop) -->
  <div id="editor-overlay" class="hidden fixed inset-0 z-50 bg-black/40 md:p-6 flex items-center justify-center">
    <div id="editor-panel" role="dialog" aria-modal="true" aria-labelledby="editor-dialog-title" aria-describedby="editor-save-status" tabindex="-1" class="w-full h-full md:h-auto md:max-h-[86vh] md:max-w-2xl md:rounded-2xl border-0 md:border border-muted flex flex-col overflow-hidden transition-colors duration-150" style="box-shadow: var(--shadow-modal);">
      <!-- Editor Top Status Strip (minimal, uncluttered) -->
      <div class="px-4 md:px-6 pt-3.5 pb-1 flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0">
          <span id="editor-pinned-badge" class="hidden inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-muted">
            <i data-lucide="pin" class="w-3 h-3"></i> Pinned
          </span>
          <span id="editor-folder-pill" class="hidden inline-flex items-center gap-1 text-xs px-2 py-0.5 rounded-full bg-black/5 dark:bg-white/10 text-muted truncate"></span>
          <span id="editor-save-status" class="text-xs text-muted" role="status" aria-live="polite" aria-atomic="true">Saved on this device</span>
          <span id="editor-dialog-title" class="sr-only">Note editor</span>
          <span id="editor-created-date" class="text-[11px] text-muted ml-1"></span>
        </div>
        <div id="editor-label-pills" class="flex items-center gap-1 overflow-x-auto"></div>
      </div>

      <!-- Optional Formatting Bar (hidden until More > Text formatting is toggled) -->
      <div id="formatting-bar" role="toolbar" aria-label="Text formatting" class="hidden mx-4 md:mx-6 mt-2 px-2.5 py-1.5 rounded-xl bg-black/5 dark:bg-white/5 border border-muted flex items-center flex-wrap gap-1">
        <button type="button" data-fmt="bold" aria-label="Bold" aria-pressed="false" class="fmt-btn px-2 py-1 rounded-lg hover:bg-black/10 dark:hover:bg-white/10 text-xs font-semibold" title="Bold">B</button>
        <button type="button" data-fmt="italic" aria-label="Italic" aria-pressed="false" class="fmt-btn px-2 py-1 rounded-lg hover:bg-black/10 dark:hover:bg-white/10 text-xs italic" title="Italic">I</button>
        <button type="button" data-fmt="underline" aria-label="Underline" aria-pressed="false" class="fmt-btn px-2 py-1 rounded-lg hover:bg-black/10 dark:hover:bg-white/10 text-xs underline" title="Underline">U</button>
        <span class="w-px h-4 bg-current opacity-15 mx-1"></span>
        <button type="button" data-fmt="insertUnorderedList" aria-label="Bulleted list" aria-pressed="false" class="fmt-btn p-1.5 rounded-lg hover:bg-black/10 dark:hover:bg-white/10" title="Bulleted list">
          <i data-lucide="list" class="w-3.5 h-3.5"></i>
        </button>
        <button type="button" data-fmt="insertOrderedList" aria-label="Numbered list" aria-pressed="false" class="fmt-btn p-1.5 rounded-lg hover:bg-black/10 dark:hover:bg-white/10" title="Numbered list">
          <i data-lucide="list-ordered" class="w-3.5 h-3.5"></i>
        </button>
        <button type="button" id="add-checklist-item-btn" class="px-2 py-1 rounded-lg hover:bg-black/10 dark:hover:bg-white/10 text-xs inline-flex items-center gap-1" title="Add checklist item">
          <i data-lucide="check-square" class="w-3.5 h-3.5"></i> Checklist
        </button>
      </div>

      <!-- Scrollable Writing Area -->
      <div class="flex-1 overflow-y-auto px-4 md:px-6 py-3 space-y-4">
        <input
          id="editor-title"
          type="text"
          aria-label="Note title, optional"
          placeholder="Title (optional)"
          class="w-full bg-transparent text-lg md:text-xl font-semibold text-main placeholder:text-muted/70 focus:outline-none"
        />

        <!-- Rich Text Body -->
        <div
          id="editor-body"
          contenteditable="true"
          role="textbox"
          aria-label="Note content"
          aria-multiline="true"
          spellcheck="true"
          data-placeholder="Start writing…"
          class="editor-content text-sm md:text-[15px] text-main"
        ></div>

        <!-- Checklist Section (Completed items stay in place with strikethrough) -->
        <div id="editor-checklist-section" class="hidden space-y-1.5 pt-1">
          <div id="editor-checklist-items" class="space-y-1.5"></div>
          <button id="inline-add-check-btn" type="button" class="text-xs text-muted hover:text-main inline-flex items-center gap-1.5 py-1">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Add checklist item
          </button>
        </div>

        <!-- Compact Link Cards Section -->
        <div id="editor-links-section" class="hidden space-y-2 pt-2">
          <div class="text-[11px] uppercase tracking-wider text-muted font-medium">Links</div>
          <div id="editor-links-list" class="space-y-1.5"></div>
        </div>

        <!-- Compact Attachment Rows Section (all types incl. images — no large previews) -->
        <div id="editor-attachments-section" class="hidden space-y-2 pt-2">
          <div class="text-[11px] uppercase tracking-wider text-muted font-medium">Attachments</div>
          <div id="editor-attachments-list" class="space-y-1.5"></div>
        </div>
      </div>

      <!-- Add Link Inline Popover -->
      <div id="add-link-bar" class="hidden px-4 md:px-6 py-3 border-t border-muted bg-black/[0.03] dark:bg-white/[0.03]">
        <div class="flex flex-col sm:flex-row gap-2">
          <input id="link-url-input" type="url" aria-label="Website URL" placeholder="https://example.com" class="flex-1 h-9 px-3 rounded-lg bg-elevated border border-muted text-sm text-main placeholder:text-muted focus:outline-none focus:border-strong" />
          <input id="link-title-input" type="text" aria-label="Website title override, optional" placeholder="Title override (optional)" class="flex-1 h-9 px-3 rounded-lg bg-elevated border border-muted text-sm text-main placeholder:text-muted focus:outline-none focus:border-strong" />
          <div class="flex items-center gap-1.5">
            <button id="save-link-btn" type="button" class="h-9 px-3 rounded-lg btn-olive text-xs font-medium">Add</button>
            <button id="cancel-link-btn" type="button" class="h-9 px-2.5 rounded-lg border border-muted text-xs text-muted hover:text-main">Cancel</button>
          </div>
        </div>
      </div>

      <!-- Minimal Approved Editor Toolbar: Attachment | Add link | More | Done -->
      <div class="relative px-4 md:px-6 py-3 border-t border-muted flex items-center justify-between gap-2">
        <div class="flex items-center gap-1">
          <input id="attachment-file-input" type="file" multiple class="hidden" />
          <button id="editor-attach-btn" type="button" aria-label="Attach files" class="px-2.5 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 text-sm text-main inline-flex items-center gap-1.5" title="Attach file">
            <i data-lucide="paperclip" class="w-4 h-4"></i>
            <span class="hidden sm:inline text-xs font-medium">Attachment</span>
          </button>

          <button id="editor-link-btn" type="button" aria-label="Add website link" class="px-2.5 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 text-sm text-main inline-flex items-center gap-1.5" title="Add website link">
            <i data-lucide="link-2" class="w-4 h-4"></i>
            <span class="hidden sm:inline text-xs font-medium">Add link</span>
          </button>

          <div class="relative">
            <button id="editor-more-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="editor-more-menu" class="px-2.5 py-2 rounded-xl hover:bg-black/5 dark:hover:bg-white/10 text-sm text-main inline-flex items-center gap-1.5" title="More options">
              <i data-lucide="more-horizontal" class="w-4 h-4"></i>
              <span class="hidden sm:inline text-xs font-medium">More</span>
            </button>

            <!-- More Options Menu -->
            <div id="editor-more-menu" role="group" aria-label="More note options" class="hidden absolute bottom-12 left-0 w-64 rounded-2xl bg-elevated border border-muted p-2 z-50 space-y-1 text-sm" style="box-shadow: var(--shadow-modal);">
              <!-- Note colour swatches -->
              <div class="px-2.5 py-1.5">
                <div class="text-[11px] text-muted mb-1.5">Note colour</div>
                <div id="editor-colour-swatches" class="flex items-center gap-2"></div>
              </div>
              <div class="border-t border-muted my-1"></div>

              <button id="more-pin-btn" type="button" class="w-full px-2.5 py-1.5 rounded-lg hover:bg-surface flex items-center gap-2.5 text-left text-xs">
                <i data-lucide="pin" class="w-3.5 h-3.5 text-muted"></i>
                <span id="more-pin-label">Pin note</span>

          list = state.notes.filter(n => n.trashed);
        } else if (currentView === 'folders' && activeFolderId) {
          list = state.notes.filter(n => !n.archived && !n.trashed && (activeFolderId === '__unfiled__' ? !n.folderId : n.folderId === activeFolderId));
        } else if (currentView === 'labels' && activeLabelId) {
          list = state.notes.filter(n => !n.archived && !n.trashed && (n.labelIds || []).includes(activeLabelId));
        } else {
          list = state.notes.filter(n => !n.archived && !n.trashed);
        }

        if (q) {
          if (currentView !== 'archive' && currentView !== 'trash') list = list.filter(n => !n.archived && !n.trashed && matchesSearch(n, q));
          else list = list.filter(n => matchesSearch(n, q));
        }

        // Relevance first. Equal scores fall back to normal pinned/manual ordering.
        return list.sort((a, b) => {
          if (q) {
            const delta = searchScore(b, q) - searchScore(a, q);
            if (delta) return delta;
          }
          if (a.pinned !== b.pinned) return a.pinned ? -1 : 1;
          return (a.order || 0) - (b.order || 0);
        });
      }

      let resetInProgress = false;

      async function listAccountStoragePaths(userId) {
        const paths = [];
        async function walk(prefix) {
          let offset = 0;
          while (true) {
            const result = await supabaseClient.storage.from('memory-attachments').list(prefix, { limit: 1000, offset, sortBy: { column: 'name', order: 'asc' } });
            if (result.error) throw result.error;
            const items = result.data || [];
            for (const item of items) {
              if (item.id === null) await walk(prefix + '/' + item.name);
              else paths.push(prefix + '/' + item.name);
            }
            if (items.length < 1000) break;
            offset += items.length;
          }
        }
        await walk(userId);
        return paths;
      }

      async function resetCurrentAccountData() {
        if (resetInProgress || !authUser || !supabaseClient) return;
        const userId = authUser.id;
        const email = authUser.email || 'this Google account';
        const typed = window.prompt('This permanently erases all Memory notes, folders, labels, and attachments for ' + email + '. Your Google account will stay signed in.\n\nType RESET to continue:');
        if (typed !== 'RESET') {
          if (typed !== null) showToast('Reset cancelled. Type RESET exactly to confirm.');
          return;
        }
        if (!navigator.onLine) { showToast('Connect to the internet before resetting this account.'); return; }

        resetInProgress = true;
        const wasSyncReady = syncReady;
        syncReady = false;
        clearTimeout(syncTimer);
        try {
          await persistenceQueue.catch(() => {});
          while (syncInProgress) await new Promise(resolve => setTimeout(resolve, 50));
          if (!authUser || authUser.id !== userId) throw new Error('The signed-in account changed. No reset was performed.');

          const pendingMarker = await supabaseClient.from('labels').upsert({user_id:userId,client_id:RESET_MARKER_CLIENT_ID,name:'RESET_PENDING',colour:'olive',deleted_at:null},{onConflict:'user_id,client_id'});
          if (pendingMarker.error) throw pendingMarker.error;

          const storagePaths = await listAccountStoragePaths(userId);
          for (let i = 0; i < storagePaths.length; i += 1000) {
            const removed = await supabaseClient.storage.from('memory-attachments').remove(storagePaths.slice(i, i + 1000));
            if (removed.error) throw removed.error;
          }

          for (const table of ['note_labels', 'attachments', 'notes', 'folders']) {
            const result = await supabaseClient.from(table).delete().eq('user_id', userId);
            if (result.error) throw result.error;
          }
          const deleteLabels = await supabaseClient.from('labels').delete().eq('user_id', userId).neq('client_id', RESET_MARKER_CLIENT_ID);
          if (deleteLabels.error) throw deleteLabels.error;
          const completeMarker = await supabaseClient.from('labels').upsert({user_id:userId,client_id:RESET_MARKER_CLIENT_ID,name:'RESET_COMPLETE',colour:'olive',deleted_at:null},{onConflict:'user_id,client_id'}).select('updated_at').single();
          if (completeMarker.error) throw completeMarker.error;
          const resetAt = completeMarker.data.updated_at;

          const retainedTheme = state.theme === 'dark' ? 'dark' : 'light';
          await deleteDatabaseState(activeStorageKey);
          state = normalizeState({ ...getDefaultData(), theme: retainedTheme, syncMeta: { accountResetAt: resetAt } });
          lastSavedState = cloneData(state);
          suppressDeleteDetection = true;
          const saved = await saveState();
          suppressDeleteDetection = false;
          if (!saved) throw new Error('Cloud data was erased, but the empty local workspace could not be saved. Reload Memory to finish local cleanup.');

          editingNoteId = null; editorDraft = null; clearTimeout(autoSaveTimer);
          document.getElementById('editor-overlay').classList.add('hidden');
          currentView = 'home'; activeFolderId = null; activeLabelId = null; searchQuery = '';
          selectionMode = false; selectedIds.clear();
          syncStatus = 'synced'; syncError = '';
          applyTheme(); renderAll();
          showToast('Memory reset. Your Google account is still signed in.');
        } catch (error) {
          console.error('Memory account reset failed:', error);
          syncStatus = 'error';

      function blobToDataUrl(blob) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = () => reject(reader.error || new Error('Could not read attachment for backup.'));
          reader.readAsDataURL(blob);
        });
      }

      function dataUrlToBlob(dataUrl) {
        const [meta, base64] = String(dataUrl).split(',');
        const mime = (meta.match(/^data:([^;]+)/) || [])[1] || 'application/octet-stream';
        const binary = atob(base64 || '');
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        return new Blob([bytes], { type: mime });
      }

      async function exportCompleteBackup() {
        try {
          await persistenceQueue;
          const backup = cloneData(state);
          for (const note of backup.notes) {
            for (const attachment of (note.attachments || [])) {
              const blob = attachment.blob || attachment.fileBlob;
              if (blob instanceof Blob) {
                attachment.dataUrl = await blobToDataUrl(blob);
                delete attachment.blob; delete attachment.fileBlob;
              }
            }
          }
          const payload = { format: 'memory-complete-backup', version: 2, exportedAt: new Date().toISOString(), state: backup };
          const blob = new Blob([JSON.stringify(payload)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a'); a.href = url; a.download = `memory-backup-${new Date().toISOString().slice(0,10)}.json`; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
          showToast('Complete backup exported');
        } catch (error) { console.error(error); showToast('Backup export failed'); }
      }

      async function importCompleteBackup(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        try {
          const parsed = JSON.parse(await file.text());
          const imported = parsed && parsed.state ? parsed.state : parsed;
          if (!imported || !Array.isArray(imported.notes) || !Array.isArray(imported.folders) || !Array.isArray(imported.labels)) throw new Error('Invalid backup structure');
          for (const note of imported.notes) {
            for (const attachment of (note.attachments || [])) {
              if (attachment.dataUrl) { attachment.blob = dataUrlToBlob(attachment.dataUrl); delete attachment.dataUrl; }
            }
          }
          state = normalizeState(imported);
          await saveState(); applyTheme(); renderAll(); showToast('Backup restored');
        } catch (error) { console.error(error); showToast('Could not restore this backup'); }
        finally { event.target.value = ''; }
      }

      // --- CARD INTERACTIONS: TAP, LONG-PRESS, HANDLE-ONLY DRAG ---
      function bindMainEvents() {
        const quickBtn = document.getElementById('quick-capture-btn');
        if (quickBtn) {
          quickBtn.addEventListener('click', () => openEditor(null));
        }

        const backFolders = document.getElementById('back-to-folders-btn');
        if (backFolders) {
          backFolders.addEventListener('click', () => {
            activeFolderId = null;
            renderAll();
          });
        }

        const backLabels = document.getElementById('back-to-labels-btn');
        if (backLabels) {
          backLabels.addEventListener('click', () => {
            activeLabelId = null;
            renderAll();
          });
        }

        const emptyTrashBtn = document.getElementById('empty-trash-btn');
        if (emptyTrashBtn) {
          emptyTrashBtn.addEventListener('click', () => {
            const count = state.notes.filter(n => n.trashed).length;
            openConfirm({
              title: 'Empty Trash?',
              message: `Permanently delete ${count} ${count === 1 ? 'note' : 'notes'}? This cannot be undone.`,
              destructive: true,
              onConfirm: () => {
                state.notes = state.notes.filter(n => !n.trashed);
                saveState();
                renderAll();
                showToast('Trash emptied');
              }
            });
          });
        }

        document.querySelectorAll('[data-note-id]').forEach(card => {
          const id = card.getAttribute('data-note-id');
          let pressTimer = null;
          let longPressed = false;

          const handle = card.querySelector('.drag-handle');
          if (handle) {
            handle.addEventListener('pointerdown', e => {
              e.stopPropagation();
              allowDragFromHandle = true;
              if (e.pointerType === 'touch' || e.pointerType === 'pen') {
                const start = { id, x: e.clientX, y: e.clientY, active: false, targetId: null };
                handle.setPointerCapture?.(e.pointerId);
                const move = ev => {
                  if (!start.active && Math.hypot(ev.clientX - start.x, ev.clientY - start.y) < 7) return;
                  start.active = true;
                  card.classList.add('is-dragging');
                  const under = document.elementFromPoint(ev.clientX, ev.clientY)?.closest('[data-note-id]');
                  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                  if (under && under.getAttribute('data-note-id') !== id) {
                    const a = state.notes.find(n => n.id === id); const b = state.notes.find(n => n.id === under.getAttribute('data-note-id'));
                    if (a && b && a.pinned === b.pinned) { start.targetId = b.id; under.classList.add('drag-over'); }
                  }
                };
                const finish = () => {
                  handle.removeEventListener('pointermove', move);
                  handle.removeEventListener('pointerup', finish);
                  handle.removeEventListener('pointercancel', finish);
                  card.classList.remove('is-dragging');
                  document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
                  if (start.active && start.targetId) reorderNotes(start.id, start.targetId);
                  allowDragFromHandle = false;
                };
                handle.addEventListener('pointermove', move);
                handle.addEventListener('pointerup', finish);
                handle.addEventListener('pointercancel', finish);
              }
            });
            handle.addEventListener('pointerup', e => {
              if (e.pointerType === 'mouse' && !draggingNoteId) allowDragFromHandle = false;
            });
            handle.addEventListener('click', e => e.stopPropagation());
          }

          card.addEventListener('pointerdown', e => {
            if (e.target.closest('.drag-handle')) return;
            allowDragFromHandle = false;
            longPressed = false;
            pressTimer = setTimeout(() => {
              longPressed = true;
              if (!selectionMode) {
                selectionMode = true;
                selectedIds.clear();
              }
              toggleSelection(id);
            }, 450);
          });

          const cancelPress = () => {
            if (pressTimer) {
              clearTimeout(pressTimer);
              pressTimer = null;
            }
          };

          card.addEventListener('pointerup', cancelPress);
          card.addEventListener('pointerleave', cancelPress);
          card.addEventListener('pointercancel', cancelPress);

          card.addEventListener('keydown', e => {
            if (e.target !== card || e.target.closest('.drag-handle')) return;
            if (e.key === 'Enter' || e.key === ' ') {
              e.preventDefault();
              if (selectionMode) toggleSelection(id);
              else openEditor(id);
            }
          });

          card.addEventListener('click', e => {
            if (e.target.closest('.drag-handle')) return;
            if (longPressed) {
              longPressed = false;
              return;
            }
            if (selectionMode) {
              toggleSelection(id);
            } else {
              openEditor(id);
            }
          });

          // Handle-only drag & drop
          card.addEventListener('dragstart', e => {
            if (!allowDragFromHandle || selectionMode) {
              e.preventDefault();
              return;
            }
            draggingNoteId = id;
            card.classList.add('is-dragging');
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', id);
          });

          card.addEventListener('dragend', () => {
            draggingNoteId = null;
            allowDragFromHandle = false;
            card.classList.remove('is-dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
          });

          card.addEventListener('dragover', e => {
            if (!draggingNoteId || draggingNoteId === id) return;
            const dragged = state.notes.find(n => n.id === draggingNoteId);
            const target = state.notes.find(n => n.id === id);
            if (!dragged || !target || dragged.pinned !== target.pinned) return;
            e.preventDefault();
            card.classList.add('drag-over');
          });

          card.addEventListener('dragleave', () => {
            card.classList.remove('drag-over');
          });

          card.addEventListener('drop', e => {
            e.preventDefault();
            card.classList.remove('drag-over');
            if (!draggingNoteId || draggingNoteId === id) return;
            reorderNotes(draggingNoteId, id);
          });
        });
      }

      function reorderNotes(sourceId, targetId) {
        const source = state.notes.find(n => n.id === sourceId);
        const target = state.notes.find(n => n.id === targetId);
        if (!source || !target || source.pinned !== target.pinned) return;

        const group = state.notes
          .filter(n => !n.archived && !n.trashed && n.pinned === source.pinned)
          .sort((a, b) => (a.order || 0) - (b.order || 0));

        const fromIdx = group.findIndex(n => n.id === sourceId);
        const toIdx = group.findIndex(n => n.id === targetId);
        if (fromIdx === -1 || toIdx === -1) return;

        const [moved] = group.splice(fromIdx, 1);
        group.splice(toIdx, 0, moved);
        group.forEach((n, idx) => {
          n.order = (source.pinned ? 1 : 1000) + idx;
        });

        saveState();
        renderAll();
      }

      // --- MULTI-SELECT & BULK TOOLBAR ---
      function toggleSelection(id) {
        if (selectedIds.has(id)) {
          selectedIds.delete(id);
        } else {
          selectedIds.add(id);
        }
        if (selectedIds.size === 0) {
          selectionMode = false;
        }
        renderAll();
      }

      function exitSelectionMode() {

            </button>

              <i data-lucide="folder-input" class="w-3.5 h-3.5"></i><span>Move</span>

              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i><span>Delete</span>

          // Immediate: Pin / Unpin
          document.getElementById('bulk-pin-btn').addEventListener('click', () => {

      function renderSwatches(containerId, activeId, onPick) {
        const el = document.getElementById(containerId);
        if (!el) return;
        const isDark = state.theme === 'dark';
        el.innerHTML = NOTE_COLOURS.map(c => {
          const bg = isDark ? c.swatchDark : c.swatchLight;
          const active = c.id === activeId;
          return `
            <button
              type="button"
              data-colour="${c.id}"
              title="${c.label}"
              aria-label="${c.label}"
              class="w-6 h-6 rounded-full border flex items-center justify-center transition-transform hover:scale-105"
              style="background-color: ${bg}; border-color: ${active ? 'var(--accent-olive)' : 'var(--border-strong)'}; ${active ? 'box-shadow: 0 0 0 2px var(--accent-olive);' : ''}"
            >
              ${active ? '<i data-lucide="check" class="w-3 h-3 text-main"></i>' : ''}
            </button>
          `;
        }).join('');
        el.querySelectorAll('[data-colour]').forEach(btn => {
