name: Security verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  service-worker-and-browser-security:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright test runner
        run: npm install --no-save playwright@1.56.1
      - name: Install cross-browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run service-worker and browser security tests
        run: node --test tests/service-worker.test.cjs tests/security-browser.test.cjs tests/responsive-browser.test.cjs tests/sync-core.test.cjs tests/storage-browser.test.cjs tests/state-core.test.cjs tests/auth-core.test.cjs tests/editor-core.test.cjs tests/realtime-core.test.cjs
