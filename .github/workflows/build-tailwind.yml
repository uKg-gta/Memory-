name: Build production Tailwind CSS
run-name: Compile Tailwind CSS for main

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip tailwind build]')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Compile Tailwind CSS 3.4.17
        run: npx --yes tailwindcss@3.4.17 -c tailwind.config.cjs -i ./src/tailwind.css -o ./tailwind.css --minify

      - name: Verify generated stylesheet
        run: |
          test -s ./tailwind.css
          grep -Fq '.grid{' ./tailwind.css
          grep -Fq '.grid-cols-2{' ./tailwind.css
          grep -Fq '.md\:flex{' ./tailwind.css
          grep -Fq '.p-3\.5{' ./tailwind.css
          grep -Fq '.dark\:bg-white' ./tailwind.css
          echo "Generated stylesheet: $(wc -c < ./tailwind.css) bytes"

      - name: Commit compiled stylesheet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tailwind.css
          if git diff --cached --quiet; then
            echo "Compiled stylesheet is already current."
          else
            git commit -m "Build production Tailwind stylesheet [skip tailwind build]"
            if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              git push origin "HEAD:$GITHUB_HEAD_REF"
            else
              git push origin main
            fi
          fi
